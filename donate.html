<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Donate - CharityFund</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <!-- Navbar -->
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container">
      <a class="navbar-brand" href="#">CharityFund</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarNav">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
          <li class="nav-item"><a class="nav-link" href="about.html">About</a></li>
          <li class="nav-item"><a class="nav-link" href="campaigns.html">Campaigns</a></li>
          <li class="nav-item"><a class="nav-link active" href="donate.html">Donate</a></li>
          <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <!-- Donation Form -->
  <section class="py-5">
    <div class="container">
      <h2 class="text-center mb-4">Make a Donation</h2>
      <form id="donationForm" onsubmit="return validateDonationForm()">
        <div class="mb-3">
          <label for="donorName" class="form-label">Full Name</label>
          <input type="text" class="form-control" id="donorName" required>
        </div>
        <div class="mb-3">
          <label for="donorEmail" class="form-label">Email Address</label>
          <input type="email" class="form-control" id="donorEmail" required>
        </div>
        <div class="mb-3">
          <label for="donationAmount" class="form-label">Amount (MYR)</label>
          <input type="number" class="form-control" id="donationAmount" required>
        </div>
        <div class="mb-3">
          <label for="paymentMethod" class="form-label">Payment Method</label>
          <select class="form-select" id="paymentMethod" required>
            <option value="">-- Select Payment Method --</option>
            <option value="Credit Card">Credit Card</option>
            <option value="Online Banking">Online Banking</option>
            <option value="PayPal">PayPal</option>
          </select>
        </div>
        <button type="submit" class="btn btn-success">Donate Now</button>
      </form>
    </div>
  </section>

  <!-- Footer -->
  <footer class="bg-dark text-white text-center py-3">
    <div class="container">
      &copy; 2025 CharityFund. All rights reserved.
    </div>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/script.js"></script>
</body>
</html>
